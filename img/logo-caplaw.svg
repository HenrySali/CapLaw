<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="96" fill="#0F172A"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- === BALANCE SCALE === -->
  <!-- Pillar -->
  <rect x="97.5" y="42" width="5" height="52" rx="2.5" fill="#0EA5E9"/>
  <!-- Pillar top ornament -->
  <circle cx="100" cy="40" r="4" fill="#0EA5E9"/>
  <!-- Base pedestal -->
  <rect x="85" y="92" width="30" height="4" rx="2" fill="#0EA5E9"/>
  <rect x="90" y="88" width="20" height="5" rx="1" fill="#0EA5E9" opacity="0.7"/>

  <!-- Beam (horizontal bar) -->
  <rect x="58" y="48" width="84" height="3.5" rx="1.75" fill="#38BDF8"/>

  <!-- Left chain -->
  <line x1="62" y1="51.5" x2="62" y2="68" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="78" y1="51.5" x2="78" y2="68" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Left plate -->
  <path d="M 55 68 C 55 68, 62 72, 70 72 C 78 72, 85 68, 85 68" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right chain -->
  <line x1="122" y1="51.5" x2="122" y2="68" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="138" y1="51.5" x2="138" y2="68" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Right plate -->
  <path d="M 115 68 C 115 68, 122 72, 130 72 C 138 72, 145 68, 145 68" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === TEXT === -->
  <!-- "Cap" -->
  <text x="52" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFFFFF">Cap</text>
  <!-- "Law" -->
  <text x="113" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFFFFF">Law</text>
  
  <!-- Cyan accent underlines -->
  <line x1="52" y1="134" x2="97" y2="134" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <line x1="113" y1="134" x2="162" y2="134" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="100" y="156" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle" letter-spacing="2.5">CONSULTORÍA JURÍDICA</text>
</svg>
