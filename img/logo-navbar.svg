<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  
  <!-- Mini balance scale -->
  <!-- Pillar -->
  <rect x="19" y="7" width="2" height="11" rx="1" fill="#fff"/>
  <!-- Top circle -->
  <circle cx="20" cy="6.5" r="1.8" fill="#fff"/>
  <!-- Beam -->
  <rect x="9" y="8.5" width="22" height="1.5" rx="0.75" fill="#fff" opacity="0.9"/>
  <!-- Left chain + plate -->
  <line x1="11" y1="10" x2="11" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
  <line x1="17" y1="10" x2="17" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
  <path d="M 9 15 C 9 15, 11 17, 14 17 C 17 17, 19 15, 19 15" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right chain + plate -->
  <line x1="23" y1="10" x2="23" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
  <line x1="29" y1="10" x2="29" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
  <path d="M 21 15 C 21 15, 23 17, 26 17 C 29 17, 31 15, 31 15" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="15" y="18" width="10" height="1.5" rx="0.75" fill="#fff" opacity="0.8"/>
  
  <!-- CL text -->
  <text x="20" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">CL</text>
</svg>
